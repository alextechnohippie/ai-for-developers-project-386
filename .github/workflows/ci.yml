name: ci

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Одна команда проверок — та же, что локально (см. AGENTS.md): mise run check.
# Она включает и браузерный e2e на живом стеке (Ktor + собранный фронт).
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup mise (pinned tools)
        uses: jdx/mise-action@v2
        with:
          version: 2026.10.25

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('backend/**/*.gradle.kts', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: mise run install

      - name: Install Playwright system dependencies
        working-directory: e2e
        run: npx playwright install-deps chromium

      - name: Run all checks
        run: mise run check
